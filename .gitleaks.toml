# gitleaks 설정 (docs/05 §8, CLAUDE.md 규칙 7)
# 기본 룰셋을 확장한다. allowlist 는 문서·리서치의 예시 문자열 오탐 방지용 —
# 실제 시크릿은 애초에 저장소에 존재할 수 없는 구조가 1차 방어선이다.

[extend]
useDefault = true

[allowlist]
description = "Planning docs and research notes may quote example tokens/URLs"
paths = [
  '''docs/.*\.md''',
  '''research/.*\.md''',
  '''MASTER_PLAN\.md''',
  '''pnpm-lock\.yaml''',
  # 빌드 산출물·캐시 (gitignore 대상 — --no-git 로컬 스캔 오탐 방지.
  # Next 가 캐시에 넣는 난수 키는 시크릿이 아니며 커밋되지 않는다)
  '''(^|/)\.next/''',
  '''(^|/)out/''',
  '''(^|/)node_modules/''',
]
