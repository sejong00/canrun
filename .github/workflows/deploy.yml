# Cloudflare Pages 배포 (docs/05 §1·§8)
#
# 시크릿 제로 원칙: 토큰은 GitHub Actions Secrets 에만 존재한다.
#   - CLOUDFLARE_API_TOKEN  (권한: Cloudflare Pages — Edit 만, 최소 권한)
#   - CLOUDFLARE_ACCOUNT_ID
# 등록: GitHub → Settings → Secrets and variables → Actions. 파일 저장·echo 금지.
# 사전 조건: Cloudflare 대시보드에서 Pages 프로젝트 `canrun` 생성 (Direct Upload).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # daily-rebuild 에서 재사용 — 필요한 시크릿만 명시 선언 (최소 전달)
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (static export + postbuild)
        run: pnpm build

      # IndexNow (10-16 D93, scripts/indexnow.ts) — 배포 전에 지금 사이트의 사이트맵·키 파일을 받아 두고(바뀐 URL 만 고르려고),
      # 배포가 성공하면 새로 생기거나 lastmod 가 바뀐 URL 을 네이버·api.indexnow.org 에 보낸다. 시크릿 없음(키는 공개 값).
      # 스크립트는 실패해도 경고만 남기고 exit 0 — continue-on-error 는 그래도 배포를 막지 않기 위한 이중 안전장치.
      # daily-rebuild(workflow_call)도 이 잡을 그대로 돈다.
      - name: Fetch live sitemaps (IndexNow baseline)
        continue-on-error: true
        run: pnpm run indexnow fetch "$RUNNER_TEMP/indexnow-live"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 pages deploy apps/web/out --project-name=canrun

      - name: IndexNow submit (new or changed URLs)
        continue-on-error: true
        run: pnpm run indexnow submit "$RUNNER_TEMP/indexnow-live"
