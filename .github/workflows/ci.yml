# CI 게이트 (docs/05 §6·§8): typecheck → lint → test → 데이터 검증 → build → 산출물 불변식
# → Playwright 스모크 → Lighthouse CI (P1-1 에서 연결), 병렬로 gitleaks 시크릿 스캔.
# E2E·LHCI 는 build 산출물을 scripts/serve-out.ts (Cloudflare Pages 경로 매핑 모사) 로 띄워 검사한다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # 버전은 package.json 의 packageManager 필드에서 읽는다

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests + engine coverage gate (90%+)
        run: pnpm test:coverage

      - name: Validate data (zod gate)
        run: pnpm validate-data

      - name: Build (static export + postbuild)
        run: pnpm build

      - name: Export invariants (i18n spike — en root + /ko/)
        run: pnpm test:export

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke (Playwright)
        run: pnpm test:e2e

      # 예산은 lighthouserc.json — 4개 카테고리 ≥0.9 · 스크립트 전송량(gzip) ≤150KB · CLS ≤0.1 = error,
      # LCP ≤2s = warn (콤보 템플릿 예산은 P1-2). 3회 측정의 median-run 기준 (기본 optimistic 은 최고값).
      - name: Lighthouse CI
        run: pnpm lhci

      # 리포트는 워크플로 아티팩트로만 — temporary-public-storage(공개 URL) 업로드 금지.
      # 실패했을 때만 14일 보관 — 매번 90일씩 쌓여 저장 한도를 넘긴 적이 있다(PROGRESS §4 D78).
      - name: Upload Lighthouse report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lhci-report/
          if-no-files-found: ignore
          retention-days: 14

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 전체 히스토리 스캔 (docs/05 §8)

      # 액션 대신 공식 이미지 직접 실행 — org 라이선스 키 요구를 피하고 버전을 고정한다.
      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 \
            detect --source /repo --config /repo/.gitleaks.toml \
            --log-opts="--all" --redact --verbose
