# 일간 신모델 감지 → GitHub issue (docs/03 §5.2, 48h 플레이북 docs/04 §8).
# 스크립트는 read-only 로 후보만 출력 — 이슈 생성·제목 기반 중복 제거는 여기서 gh CLI 로.
name: New model alert

on:
  schedule:
    - cron: '30 21 * * *' # 매일 21:30 UTC = 06:30 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 버전은 package.json 의 packageManager 필드에서 읽는다

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Detect new models
        run: pnpm run new-model-alert -- --json > candidates.json

      - name: Create issues (dedupe by title)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          count=$(jq 'length' candidates.json)
          echo "candidates: $count"
          gh label create new-model --color 0e8a16 --description "신모델 감지 (docs/03 §5.2)" 2>/dev/null || true
          jq -c '.[]' candidates.json | while read -r c; do
            title=$(jq -r .issueTitle <<<"$c")
            existing=$(gh issue list --state all --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
            if [ -z "$existing" ]; then
              gh issue create --title "$title" --label new-model --body "$(jq -r .issueBody <<<"$c")"
              echo "created: $title"
            else
              echo "skip (exists #$existing): $title"
            fi
          done
