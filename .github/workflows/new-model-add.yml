# 신모델 자동 추가 ① → PR (docs/03 §5.3, PROGRESS §4 D71).
# New model alert 가 끝나면 이어서 돈다(매일). scripts/auto-add-models.ts 가 최근 14일 신모델 후보를 골라 add-model 로
# 레코드를 만들고(한 번에 최대 3종), 생각 모드·용도·한국어를 추정해 넣은 뒤 validate-data·pnpm test·build·test:export 를 통과하면 PR 을 연다.
# 자동 머지·main 푸시는 하지 않는다 — 검토·머지는 Claude 정기 작업(②, CLAUDE.md 위임)이 모델 카드와 대조한 뒤에.
# ② 와의 계약(이름을 바꾸지 말 것): 브랜치 data/new-models · 라벨 new-model-add · 제목 접두 "feat(catalog): 신모델 자동 추가"
#   · 본문 = 보고서(추정값과 근거, "확인 필요" 표) · 스킵 목록 scripts/new-model-skips.json.
# 브랜치는 매 실행 main 에서 다시 만든다(create-pull-request 기본 — 전날 PR 이 열려 있으면 그 PR 이 갱신된다).
# GITHUB_TOKEN 이 만든 PR 이라 CI job 이 돌지 않는다(data-sync 와 같음 — PROGRESS §5) → 검사는 이 job 안에서 먼저 돈다.
# 추가가 0 이거나 검사가 실패하면 PR 대신 그날 new-model 요약 이슈(있으면)에 보고서를 코멘트하고, 검사 실패는 런을 실패로 남긴다.
name: New model add

on:
  workflow_run:
    workflows: ['New model alert']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: new-model-add
  cancel-in-progress: false

jobs:
  add:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # 버전은 package.json 의 packageManager 필드에서 읽는다

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Pick, estimate, add and check (writes data/*.json + report)
        id: auto
        run: pnpm exec tsx scripts/auto-add-models.ts --report new-models-report.md
        env:
          # 선택 — 공개 API 는 무토큰으로 충분, gated 저장소의 config·채팅 템플릿만 필요 (docs/05 §8)
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Ensure label
        if: steps.auto.outputs.added != '0' && steps.auto.outputs.gate == 'pass'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh label create new-model-add --color 1d76db --description "신모델 자동 추가 PR (docs/03 §5.3)" 2>/dev/null || true

      - uses: peter-evans/create-pull-request@v8
        if: steps.auto.outputs.added != '0' && steps.auto.outputs.gate == 'pass'
        with:
          branch: data/new-models
          title: 'feat(catalog): 신모델 자동 추가 (${{ steps.auto.outputs.date }})'
          commit-message: |
            feat(catalog): 신모델 자동 추가 (${{ steps.auto.outputs.date }})

            Co-Authored-By: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          body-path: new-models-report.md
          add-paths: |
            data/*.json
            packages/data/src/index.ts
            apps/web/assets/og/*
          labels: new-model-add

      - name: Comment the report on today's new-model digest (no PR)
        if: steps.auto.outputs.added == '0' || steps.auto.outputs.gate == 'fail'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # 24시간 안에 만들어진 요약 이슈("[new-model] 후보 …") — 알림이 새 후보를 못 찾은 날은 이슈가 없어 코멘트를 생략한다
          number=$(gh issue list --label new-model --state all --limit 20 --json number,title,createdAt \
            --jq '[.[] | select((.title | startswith("[new-model] 후보")) and ((.createdAt | fromdateiso8601) > (now - 86400)))] | .[0].number // empty')
          if [ -z "$number" ]; then
            echo "오늘 요약 이슈 없음 — 코멘트 생략"
            exit 0
          fi
          gh issue comment "$number" --body-file new-models-report.md
          echo "commented on #$number"

      - name: Fail the run when the final check failed
        if: steps.auto.outputs.gate == 'fail'
        run: |
          echo "최종 검사 실패 — PR 을 만들지 않았다 (보고서는 요약 이슈 코멘트·이 런 로그)"
          exit 1
